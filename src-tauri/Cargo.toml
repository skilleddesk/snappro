[package]
name = "snappro"
version = "0.1.3"
description = "SnapPro — Screenshot, Editor & Screen Recorder"
authors = ["SnapPro"]
edition = "2021"

[lib]
name = "snappro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
xcap = "0.9.8"
image = "0.25"
chrono = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
base64 = "0.22"
ureq = "3"
enigo = "0.6"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Wayland: screenshots and screen recording go through the XDG desktop portal.
# Both crates are already in the tree through xcap / tauri.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
